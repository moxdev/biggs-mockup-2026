<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biggs Responsive Hero Prototype</title>
  <meta name="description" content="Responsive Biggs website hero prototype built with Tailwind CSS v4 browser CDN." />

  <!-- Fonts: no font files are bundled. Fonts load from Google Fonts for prototype use. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v4 browser CDN for prototype HTML -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    @theme {
      --font-heading: "League Spartan", Arial, Helvetica, sans-serif;
      --font-body: "Open Sans", Arial, Helvetica, sans-serif;

      --color-biggs-navy: #001F3F;
      --color-biggs-navy-dark: #00162D;
      --color-biggs-blue: #234F91;
      --color-biggs-red: #E00A17;
      --color-biggs-yellow: #FACB06;
      --color-biggs-green: #2E7D32;

      /* Custom 3xl breakpoint requested for wide screens */
      --breakpoint-3xl: 120rem;
    }
  </style>

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #001F3F;
    }

    /* Header starts transparent over hero, then becomes white on scroll. */
    .site-header {
      background: transparent;
      box-shadow: none;
      transition: background-color 220ms ease, box-shadow 220ms ease, backdrop-filter 220ms ease;
    }

    .site-header.is-scrolled {
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(12px);
    }

    .nav-link,
    .menu-icon {
      color: #ffffff;
      transition: color 220ms ease;
    }

    .site-header.is-scrolled .nav-link,
    .site-header.is-scrolled .menu-icon {
      color: #001F3F;
    }

    .headline-shadow {
      text-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
    }

    .hero-copy-shadow {
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
    }
  </style>
</head>

<body class="font-body text-white antialiased overflow-x-hidden">
  <!--
    Tailwind default breakpoint guide used in this prototype:
    base: < 640px
    sm:   640px+
    md:   768px+
    lg:   1024px+   Desktop hero structure begins
    xl:   1280px+
    2xl:  1536px+
    3xl:  1920px+   Custom max-width target
  -->

  <div class="min-h-screen w-full bg-biggs-navy">
    <!-- Sticky/fixed header sits outside the hero content and overlays the top of the page. -->
    <header id="siteHeader" class="site-header fixed inset-x-0 top-0 z-50 w-full">
      <div class="mx-auto flex h-[112px] w-full max-w-[1920px] items-center justify-between px-[20px] lg:h-[128px] lg:px-[40px]">
        <a href="#" class="inline-flex shrink-0 items-center" aria-label="Biggs home">
          <img
            src="assets/biggs-logo.svg"
            alt="Biggs HVAC, Plumbing, Electrical, Septic & Sewer"
            class="w-[200px] h-auto lg:w-[230px]"
          />
        </a>

        <nav class="hidden items-center gap-8 xl:gap-11 lg:flex" aria-label="Primary navigation">
          <span class="nav-link cursor-pointer font-heading text-[1.05rem] font-black uppercase tracking-[0.04em]">HVAC</span>
          <span class="nav-link cursor-pointer font-heading text-[1.05rem] font-black uppercase tracking-[0.04em]">Plumbing</span>
          <span class="nav-link cursor-pointer font-heading text-[1.05rem] font-black uppercase tracking-[0.04em]">Electrical</span>
          <span class="nav-link cursor-pointer font-heading text-[1.05rem] font-black uppercase tracking-[0.04em]">Septic</span>
          <span class="nav-link cursor-pointer font-heading text-[1.05rem] font-black uppercase tracking-[0.04em]">About</span>
          <span class="nav-link cursor-pointer font-heading text-[1.05rem] font-black uppercase tracking-[0.04em]">Contact</span>
        </nav>

        <a
          href="tel:9193298288"
          class="hidden min-h-[76px] min-w-[230px] items-center justify-center bg-biggs-yellow px-10 text-center font-heading text-[1.7rem] font-black uppercase tracking-[0.03em] text-biggs-navy transition hover:bg-yellow-300 lg:inline-flex"
        >
          Call Now
        </a>

        <!-- Visual-only mobile menu icon for this prototype. -->
        <button class="menu-icon inline-flex h-12 w-12 items-center justify-center lg:hidden" aria-label="Open navigation menu" type="button">
          <svg class="h-10 w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <!-- HERO SECTION: full-width color/image layers with constrained content. -->
      <section class="relative isolate overflow-hidden bg-biggs-navy pt-[112px] lg:pt-[128px]">
        <!-- Desktop-only full-width hero background image. No container, margin, or padding. -->
        <img
          src="assets/background.png"
          alt=""
          aria-hidden="true"
          class="absolute inset-0 z-0 hidden h-full w-full object-cover object-center lg:block"
        />

        <!-- Desktop readability overlay; keeps left code-generated text area dark and readable. -->
        <div class="absolute inset-0 z-[1] hidden bg-gradient-to-r from-[#001F3F] via-[#001F3F]/82 to-[#001F3F]/15 lg:block"></div>
        <div class="absolute inset-0 z-[2] hidden bg-[radial-gradient(circle_at_74%_44%,rgba(35,79,145,0.25),transparent_42%)] lg:block"></div>

        <!-- Mobile/tablet navy background. The mobile truck/house image is displayed later as an actual image under the content. -->
        <div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_80%_18%,rgba(35,79,145,0.42),transparent_38%),linear-gradient(135deg,#062B57_0%,#001F3F_48%,#00162D_100%)] lg:hidden"></div>

        <!-- CSS/Tailwind geometric design pattern: desktop version. -->
        <div class="pointer-events-none absolute inset-0 z-[3] hidden lg:block" aria-hidden="true">
          <!-- Faint dotted pattern on the far left -->
          <div class="absolute left-0 top-0 h-[430px] w-[330px] opacity-30 [background-image:radial-gradient(rgba(35,79,145,0.9)_2px,transparent_2px)] [background-size:24px_24px]"></div>

          <!-- Large translucent brand chevron matching the designer mockup -->
          <div class="absolute left-[22%] top-0 h-full w-[650px] bg-biggs-blue/22 [clip-path:polygon(0_0,78%_0,100%_50%,78%_100%,0_100%,34%_50%)] xl:left-[26%] xl:w-[760px] 3xl:left-[31%]"></div>
          <div class="absolute left-[34%] top-0 h-full w-[310px] bg-biggs-blue/18 [clip-path:polygon(0_0,55%_0,100%_50%,55%_100%,0_100%,46%_50%)] xl:left-[40%] 3xl:left-[45%]"></div>
        </div>

        <!-- CSS/Tailwind geometric design pattern: mobile/tablet version. -->
        <div class="pointer-events-none absolute inset-0 z-[3] lg:hidden" aria-hidden="true">
          <div class="absolute right-[-120px] top-[70px] h-[520px] w-[320px] bg-biggs-blue/20 [clip-path:polygon(0_0,70%_0,100%_50%,70%_100%,0_100%,34%_50%)] sm:right-[-80px] md:right-[0px] md:w-[430px]"></div>
          <div class="absolute right-[22px] top-[60px] h-[300px] w-[220px] opacity-20 [background-image:radial-gradient(rgba(255,255,255,0.45)_1.5px,transparent_1.5px)] [background-size:16px_16px] md:right-[70px]"></div>
        </div>

        <!-- Constrained hero content. Background image remains full width; only content is constrained. -->
        <div class="relative z-10 mx-auto grid w-full max-w-[1920px] px-[20px] pb-0 pt-16 sm:pt-20 md:pt-24 lg:min-h-[780px] lg:grid-cols-[47%_53%] lg:items-center lg:px-[40px] lg:pb-0 lg:pt-0 xl:min-h-[850px] 2xl:min-h-[910px] 3xl:min-h-[980px]">
          <!-- Left content block -->
          <div class="relative z-30 max-w-[780px] lg:max-w-[760px] xl:max-w-[820px] 3xl:max-w-[900px]">
            <h1 class="headline-shadow font-heading text-[4.35rem] font-black uppercase leading-[0.82] tracking-[-0.055em] text-white sm:text-[5.7rem] md:text-[7.25rem] lg:text-[6.7rem] xl:text-[7.8rem] 2xl:text-[8.8rem] 3xl:text-[9.7rem]">
              <span class="block">One Call</span>
              <span class="mt-8 block sm:mt-10 lg:mt-12">Total Home Services</span>
            </h1>

            <div class="mt-5 h-[7px] w-[140px] rounded-full bg-biggs-yellow sm:w-[170px] lg:h-[6px] lg:w-[155px] xl:w-[175px]"></div>

            <!-- Services: 2x2 on mobile/tablet, compact row on large desktop screens. -->
            <div class="mt-10 grid grid-cols-[repeat(2,max-content)] gap-x-12 gap-y-6 sm:gap-x-16 md:gap-x-24 lg:grid-cols-[repeat(2,max-content)] lg:gap-x-10 lg:gap-y-5 xl:grid-cols-[repeat(4,max-content)] xl:gap-x-8 2xl:gap-x-10 3xl:gap-x-12">
              <!-- HVAC -->
              <div class="flex items-center gap-4 lg:gap-3">
                <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-biggs-red text-white shadow-lg lg:h-11 lg:w-11 xl:h-12 xl:w-12">
                  <svg class="h-8 w-8 lg:h-7 lg:w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v20M4.93 4.93l14.14 14.14M2 12h20M4.93 19.07 19.07 4.93" />
                    <path d="m8 4 4 4 4-4M8 20l4-4 4 4M4 8l4 4-4 4M20 8l-4 4 4 4" />
                  </svg>
                </div>
                <span class="hero-copy-shadow whitespace-nowrap font-heading text-[1.85rem] font-black uppercase tracking-tight text-white lg:text-[1.45rem] xl:text-[1.6rem] 2xl:text-[1.75rem]">HVAC</span>
              </div>

              <!-- Plumbing -->
              <div class="flex items-center gap-4 lg:gap-3">
                <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-biggs-blue text-white shadow-lg lg:h-11 lg:w-11 xl:h-12 xl:w-12">
                  <svg class="h-8 w-8 lg:h-7 lg:w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2.7S5.5 10 5.5 15.2a6.5 6.5 0 0 0 13 0C18.5 10 12 2.7 12 2.7Z" />
                    <path d="M9 16.5c.6 1.2 1.6 1.8 3 1.8" />
                  </svg>
                </div>
                <span class="hero-copy-shadow whitespace-nowrap font-heading text-[1.85rem] font-black uppercase tracking-tight text-white lg:text-[1.45rem] xl:text-[1.6rem] 2xl:text-[1.75rem]">Plumbing</span>
              </div>

              <!-- Electrical -->
              <div class="flex items-center gap-4 lg:gap-3">
                <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-biggs-yellow text-white shadow-lg lg:h-11 lg:w-11 xl:h-12 xl:w-12">
                  <svg class="h-8 w-8 lg:h-7 lg:w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 2 4 14h7l-1 8 10-13h-7l0-7Z" />
                  </svg>
                </div>
                <span class="hero-copy-shadow whitespace-nowrap font-heading text-[1.85rem] font-black uppercase tracking-tight text-white lg:text-[1.45rem] xl:text-[1.6rem] 2xl:text-[1.75rem]">Electrical</span>
              </div>

              <!-- Septic -->
              <div class="flex items-center gap-4 lg:gap-3">
                <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-biggs-green text-white shadow-lg lg:h-11 lg:w-11 xl:h-12 xl:w-12">
                  <svg class="h-8 w-8 lg:h-7 lg:w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.5 3.5C12.5 3.8 6 9.4 6 16.2c0 2.8 1.8 4.8 4.6 4.8 6.5 0 9.6-8 9.9-17.5Z" />
                    <path d="M6 21c2.4-5.1 5.8-8.4 10.5-10.5" />
                  </svg>
                </div>
                <span class="hero-copy-shadow whitespace-nowrap font-heading text-[1.85rem] font-black uppercase tracking-tight text-white lg:text-[1.45rem] xl:text-[1.6rem] 2xl:text-[1.75rem]">Septic</span>
              </div>
            </div>

            <p class="hero-copy-shadow mt-10 max-w-[640px] font-body text-[1.7rem] leading-[1.42] text-white/92 sm:text-[2rem] md:max-w-[760px] md:text-[2.25rem] lg:mt-9 lg:max-w-[560px] lg:text-[1.55rem] xl:text-[1.78rem] 2xl:max-w-[640px] 2xl:text-[2rem]">
              Biggs is your all-in-one home services partner, delivering expert solutions with speed, honesty, and care.
            </p>

            <div class="mt-9 grid gap-5 sm:max-w-[760px] lg:max-w-[600px] lg:grid-cols-2 lg:gap-5 2xl:max-w-[680px]">
              <a href="tel:9193298288" class="flex min-h-[80px] items-center justify-center bg-biggs-yellow px-8 py-4 text-center font-heading text-[2rem] font-black uppercase tracking-[0.03em] text-biggs-navy shadow-xl transition hover:bg-yellow-300 lg:min-h-[70px] lg:text-[1.65rem] xl:text-[1.85rem]">
                Call Now
              </a>
              <a href="#services" class="flex min-h-[80px] items-center justify-center border-2 border-white/90 px-8 py-4 text-center font-heading text-[2rem] font-black uppercase tracking-[0.03em] text-white transition hover:bg-white hover:text-biggs-navy lg:min-h-[70px] lg:text-[1.65rem] xl:text-[1.85rem]">
                Our Services
              </a>
            </div>
          </div>

          <!-- Desktop truck foreground layer. Hidden on mobile/tablet because the mobile image already includes the truck. -->
          <div class="pointer-events-none relative z-20 hidden h-full min-h-[760px] lg:block xl:min-h-[850px] 2xl:min-h-[910px] 3xl:min-h-[980px]" aria-hidden="true">
            <img
              src="assets/truck-cutout.png"
              alt=""
              class="absolute bottom-[7%] right-[-2.5%] w-[58vw] max-w-[970px] object-contain drop-shadow-[0_30px_34px_rgba(0,0,0,0.42)] xl:bottom-[8%] xl:right-[-4%] xl:w-[60vw] xl:max-w-[1110px] 2xl:right-[-5%] 2xl:max-w-[1240px] 3xl:right-[-5%] 3xl:max-w-[1360px]"
            />
          </div>

          <!-- Mobile/tablet image appears below the text and buttons as the designer requested. -->
          <div class="relative z-20 mx-[-20px] mt-11 lg:hidden">
            <img
              src="assets/mobile-hero.png"
              alt="Biggs service truck in front of a home with Raleigh skyline"
              class="block h-auto w-full"
            />
          </div>
        </div>
      </section>

      <!-- Placeholder for future page sections. -->
      <section id="services" class="bg-white py-20 text-biggs-navy">
        <div class="mx-auto w-full max-w-[1920px] px-[20px] lg:px-[40px]">
          <p class="font-heading text-3xl font-black uppercase tracking-tight sm:text-4xl lg:text-5xl">
            Future website sections will start here.
          </p>
        </div>
      </section>
    </main>
  </div>

  <script>
    const header = document.getElementById('siteHeader');

    function updateHeaderState() {
      if (window.scrollY > 8) {
        header.classList.add('is-scrolled');
      } else {
        header.classList.remove('is-scrolled');
      }
    }

    updateHeaderState();
    window.addEventListener('scroll', updateHeaderState, { passive: true });
  </script>
</body>
</html>
